# Fork WildKernels/OnePlus_KernelSU_SUSFS 后把本文件放到 .github/workflows/ 再手动 Run workflow。
# 只编一台 SM8650 平板（A16），产物为 AnyKernel3 zip（artifact 下载）。
#
# 已修复的坑：SUSFS 版本必须钉死。分支 gki-android14-6.1 的 HEAD 现在已经是 SUSFS v2.3.0，
# 而 build-kernel action 的 case 只支持到 v2.2.0，会直接 `Unsupported SUSFS version` 退出。
# 这里钉到 e287d59066380bf6de4396532d4a42edf4408701 = SUSFS v2.2.0（与作者 v2.2.0-r4 完全一致）。
name: Build single Pad SM8650 (A16)

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: "configs/a16 下的机型 ID"
        required: true
        type: choice
        default: OP-PAD-2-SM8650
        options:
          - OP-PAD-2-SM8650
          - OP-PAD-PRO
      build_timestamp:
        description: "uname 里的日期段（不要带 #1 SMP PREEMPT；内核会自动加）。例: Tue Jun 30 05:53:43 UTC 2026"
        required: false
        type: string
        default: "Tue Jun 30 05:53:43 UTC 2026"
      susfs_ref:
        description: "SUSFS 分支或 commit（必须是 v2.2.0 / v2.1.0 / v2.0.0 之一，否则 action 会报 Unsupported）"
        required: true
        type: string
        default: "e287d59066380bf6de4396532d4a42edf4408701"
      ksu_sha:
        description: "KernelSU-Next commit（234f6e04... = KSUVER 33239，与作者 v2.2.0-r4 一致）"
        required: true
        type: string
        default: "234f6e040fcbca18b16d2398e1aa225712ec99ad"
      clean_build:
        description: "禁用 ccache 全量编译（更慢，排错时用）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-one:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout WildKernels repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Fork 没有 toolchain-cache / ccache-cache Release，必须从上游 WildKernels 下载预缓存工具链
      - name: Point cache downloads to WildKernels upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 << 'PY'
          import pathlib
          up = "WildKernels/OnePlus_KernelSU_SUSFS"
          needle = chr(36) + chr(123) + chr(123) + " github.repository " + chr(125) + chr(125)
          files = [
              ".github/actions/kernel-source-sync/action.yml",
              ".github/actions/cache/restore/action.yml",
          ]
          for rel in files:
              p = pathlib.Path(rel)
              if not p.is_file():
                  continue
              text = p.read_text(encoding="utf-8")
              if needle not in text:
                  print(f"skip (no needle): {rel}")
                  continue
              p.write_text(text.replace(needle, up), encoding="utf-8")
              print(f"patched {rel} -> {up}")
          PY

      - name: Resolve refs
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="${{ inputs.device_model }}"
          CFG="configs/a16/${DEVICE}.json"
          test -f "$CFG" || { echo "::error::missing $CFG"; exit 1; }

          # KernelSU-Next 钉死到作者 v2.2.0-r4 用的那个 commit（KSUVER 33239）
          ksu_sha="${{ inputs.ksu_sha }}"
          [[ "$ksu_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ksu_sha 必须是 40 位 sha"; exit 1; }
          echo "KSU Next -> $ksu_sha"

          # SUSFS 钉死到 v2.2.0（action 只支持 v1.5.8/1.5.9-12/v2.0.0/v2.1.0/v2.2.0）
          susfs_ref="${{ inputs.susfs_ref }}"
          echo "SUSFS -> $susfs_ref"

          echo "ksu_sha=$ksu_sha" >> "$GITHUB_OUTPUT"
          echo "susfs_ref=$susfs_ref" >> "$GITHUB_OUTPUT"
          jq -r '"Device: \(.model)  manifest=\(.manifest)  branch=\(.branch)  os=\(.os_version)"' "$CFG"

      - name: Prepare device config JSON (multiline-safe)
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          CFG="configs/a16/${{ inputs.device_model }}.json"
          {
            echo "config_json<<EOF"
            jq -c '.' "$CFG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Emergency disk cleanup
        uses: ./.github/actions/disk-cleanup

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils pigz
          sudo apt-get clean

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="${{ github.workspace }}/.ccache"
          mkdir -p "$CACHE_DIR"
          {
            echo "CCACHE_DIR=$CACHE_DIR"
            echo "CCACHE_MAXSIZE=12G"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_BASEDIR=${{ github.workspace }}"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_COMPRESSION=true"
            echo "CCACHE_IS_KERNEL_COMPILING=true"
            echo "CCACHE_LOGFILE=${{ github.workspace }}/ccache.log"
          } >> "$GITHUB_ENV"
          touch "${{ github.workspace }}/ccache.log"

      - name: Build kernel (AnyKernel3 zip)
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.cfg.outputs.config_json }}
          ksu_type: KSUN
          ksu_branch_or_hash: ${{ steps.deps.outputs.ksu_sha }}
          susfs_commit_hash_or_branch: ${{ steps.deps.outputs.susfs_ref }}
          optimize_level: O2
          build_timestamp: ${{ inputs.build_timestamp }}
          clean: ${{ inputs.clean_build }}
          debug: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ inputs.device_model }} — ${{ job.status }}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| Kernel | ${{ steps.build.outputs.kernel_version }} |"
            echo "| KSU Next | v${{ steps.build.outputs.ksu_version }} |"
            echo "| SUSFS | ${{ steps.build.outputs.susfs_version }} |"
            echo "| ZIP | ${{ steps.build.outputs.zip_name }} |"
            echo "| 耗时 | ${{ steps.build.outputs.build_time }}s |"
            echo ""
            echo "到本 run 页面 **Artifacts** 下载 AnyKernel3 zip。刷写前确认 \`uname -r\` 与 zip 内内核版本一致。"
          } >> "$GITHUB_STEP_SUMMARY"
